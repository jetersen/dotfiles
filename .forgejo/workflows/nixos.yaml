name: NixOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: nixos-build
  cancel-in-progress: false
jobs:
  framework:
    if: forgejo.event_name != 'pull_request' || forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    runs-on: runner-rocket
    container:
      volumes:
        - dotfiles-nix-cache:/nix
        - /var/cache/nix-nas:/var/cache/nix-nas
    timeout-minutes: 90
    env:
      XDG_CACHE_HOME: /nix/var/nix/ci-cache
      ATTIC_MAX_NAR_MIB: 512
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        sandbox = false
        max-jobs = 2
        cores = 4
        always-allow-substitutes = true
        substituters = file:///var/cache/nix-nas?trusted=true https://cache.nixos.org
        narinfo-cache-negative-ttl = 0
        min-free = 10737418240
        max-free = 32212254720
    steps:
      - name: Check out the exact revision
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare CI tools and private cache access
        shell: bash
        env:
          CACHE_TOKEN: ${{ secrets.NIX_CACHE_READ_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          nix store info --store file:///var/cache/nix-nas
          printf 'machine nix-cache.jetersen.dev login attic password %s\n' "$CACHE_TOKEN" > "$RUNNER_TEMP/nix-netrc"
          export NIX_CONFIG="$NIX_CONFIG
          extra-substituters = https://nix-cache.jetersen.dev/workstations
          extra-trusted-public-keys = workstations:DVP/4iu54FicWbjvEU44a+Y7izu351Ty7+fbvaiNFas=
          netrc-file = $RUNNER_TEMP/nix-netrc"
          tools=$(nix build .#ci-tools --no-update-lock-file \
            --out-link /nix/var/nix/gcroots/ci-tools --print-out-paths)
          printf 'PATH=%s/bin:%s\n' "$tools" "$PATH" >> "$GITHUB_ENV"
          printf 'NIX_CONFIG<<NIX_CONFIG_END\n%s\nNIX_CONFIG_END\n' "$NIX_CONFIG" >> "$GITHUB_ENV"
      - name: Build the Framework system
        shell: bash
        run: |
          set -euo pipefail
          nix build .#nixosConfigurations.framework.config.system.build.toplevel \
            --no-update-lock-file --out-link /nix/var/nix/gcroots/ci-framework \
            --print-out-paths > "$RUNNER_TEMP/framework-system"
          nix eval --raw .#localGitSyncSource --no-update-lock-file \
            > "$RUNNER_TEMP/local-git-sync-source"
          nix-store --realise "$(cat "$RUNNER_TEMP/local-git-sync-source")" \
            --add-root /nix/var/nix/gcroots/ci-local-git-sync-source
      - name: Build project development shells
        shell: bash
        run: |
          set -euo pipefail
          nix build .#devShells.x86_64-linux.python .#devShells.x86_64-linux.rust \
            .#devShells.x86_64-linux.go .#devShells.x86_64-linux.jvm \
            .#devShells.x86_64-linux.pulumi --no-update-lock-file \
            --out-link /nix/var/nix/gcroots/ci-project-shells --print-out-paths \
            > "$RUNNER_TEMP/project-shells"
      - name: Publish eligible system outputs
        if: forgejo.ref == 'refs/heads/main' && forgejo.event_name != 'pull_request'
        shell: bash
        env:
          CACHE_TOKEN: ${{ secrets.NIX_CACHE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.config/attic"
          printf 'default-server = "homelab"\n[servers.homelab]\nendpoint = "https://nix-cache.jetersen.dev/"\ntoken = "%s"\n' "$CACHE_TOKEN" > "$HOME/.config/attic/config.toml"
          mapfile -t project_shells < "$RUNNER_TEMP/project-shells"
          # Locally generated paths may also exist upstream without having its
          # signature locally. Import it so Attic's upstream filter recognizes them.
          # Cache public misses for a day; private-cache lookups remain immediate.
          nix store copy-sigs --substituter https://cache.nixos.org \
            --option narinfo-cache-negative-ttl 86400 --recursive \
            "$(cat "$RUNNER_TEMP/framework-system")" "${project_shells[@]}" \
            "$(cat "$RUNNER_TEMP/local-git-sync-source")"
          # Keep large outputs local to CI and let hosts build them as needed.
          nix path-info --recursive --json \
            "$(cat "$RUNNER_TEMP/framework-system")" "${project_shells[@]}" \
            "$(cat "$RUNNER_TEMP/local-git-sync-source")" > "$RUNNER_TEMP/system-paths.json"
          jq -r --argjson maxMiB "$ATTIC_MAX_NAR_MIB" '
            to_entries[] | select(.value.narSize < ($maxMiB * 1024 * 1024)) | .key
          ' "$RUNNER_TEMP/system-paths.json" \
            | attic push --no-closure --stdin homelab:workstations
      - name: Check whether main still selects this revision
        id: current
        if: forgejo.ref == 'refs/heads/main' && forgejo.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo 'notify=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main revision exists; its build will send the notification.'
          fi
      - name: Notify Framework to pull the published deployment
        if: steps.current.outputs.notify == 'true'
        shell: bash
        env:
          NOTIFY_KEY: ${{ secrets.NIXOS_DEPLOY_NOTIFY_KEY }}
          FRAMEWORK_HOST: ${{ vars.FRAMEWORK_HOST }}
        run: |
          set -euo pipefail
          test -n "$NOTIFY_KEY"
          test -n "$FRAMEWORK_HOST"
          umask 077
          key="$RUNNER_TEMP/nixos-notify-key"
          known_hosts="$RUNNER_TEMP/nixos-notify-known-hosts"
          trap 'rm -f "$key" "$known_hosts"' EXIT
          printf '%s\n' "$NOTIFY_KEY" > "$key"
          read -r key_type public_key _ < nixos/keys/framework-host.pub
          printf 'framework %s %s\n' "$key_type" "$public_key" > "$known_hosts"
          if timeout 30 ssh -F /dev/null -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=5 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
            -o StrictHostKeyChecking=yes -o HostKeyAlias=framework \
            -o "UserKnownHostsFile=$known_hosts" "comin-notify@$FRAMEWORK_HOST" 'comin fetch'; then
            echo 'Framework accepted the deployment notification.'
          else
            echo '::warning::Framework could not accept the notification; it will check on boot, resume, or network reconnect.'
          fi
      - name: Cache build inputs and outputs on the NAS
        shell: bash
        run: nix copy --all --to 'file:///var/cache/nix-nas?compression=zstd&compression-level=1'
