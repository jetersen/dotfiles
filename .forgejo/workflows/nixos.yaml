name: NixOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: nixos-build
  cancel-in-progress: false
jobs:
  tooling:
    if: forgejo.event_name != 'pull_request' || forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    runs-on: [linux-docker, runner-kubernetes]
    timeout-minutes: 5
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_ci_graph.py'
      - run: python3 -m unittest discover -s tests -p 'test_package_updates.py'
      - run: python3 -m unittest discover -s tests -p 'test_wayland_clipboard.py'
  framework:
    needs: tooling
    if: forgejo.event_name != 'pull_request' || forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    runs-on: [linux-docker, runner-rocket]
    container:
      # Nix needs mount/network namespaces and pivot_root for strict sandboxing.
      options: --cap-add=SYS_ADMIN --cap-add=NET_ADMIN --security-opt=seccomp=unconfined
      volumes:
        - dotfiles-nix-cache:/nix
    timeout-minutes: 90
    env:
      XDG_CACHE_HOME: /nix/var/nix/ci-cache
      ATTIC_MAX_NAR_MIB: 512
      TIMEFORMAT: "CI timing: wall=%3Rs user=%3Us sys=%3Ss"
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        sandbox = true
        sandbox-fallback = false
        max-jobs = 1
        cores = 4
        substituters = https://cache.nixos.org
        narinfo-cache-negative-ttl = 0
        min-free = 10737418240
        max-free = 32212254720
    steps:
      - name: Check out the exact revision
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare CI tools and private cache access
        shell: bash
        env:
          CACHE_TOKEN: ${{ secrets.NIX_CACHE_READ_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          for metric in cpu.stat memory.events; do
            if [[ -r "/sys/fs/cgroup/$metric" ]]; then
              cp "/sys/fs/cgroup/$metric" "$RUNNER_TEMP/ci-start-$metric"
            fi
          done
          printf 'machine nix-cache.jetersen.dev login attic password %s\n' "$CACHE_TOKEN" > "$RUNNER_TEMP/nix-netrc"
          export NIX_CONFIG="$NIX_CONFIG
          extra-substituters = https://nix-cache.jetersen.dev/workstations
          extra-trusted-public-keys = workstations:DVP/4iu54FicWbjvEU44a+Y7izu351Ty7+fbvaiNFas=
          netrc-file = $RUNNER_TEMP/nix-netrc"
          tools=$(time nix build .#ci-tools --no-update-lock-file \
            --out-link /nix/var/nix/gcroots/ci-tools --print-out-paths)
          "$tools/bin/nix" --version
          printf 'PATH=%s/bin:%s\n' "$tools" "$PATH" >> "$GITHUB_ENV"
          printf 'NIX_CONFIG<<NIX_CONFIG_END\n%s\nNIX_CONFIG_END\n' "$NIX_CONFIG" >> "$GITHUB_ENV"
      - name: Build systems, checks and development tools in one graph
        shell: bash
        run: bash nixos/ci/build-systems.sh
      - name: Publish eligible system outputs
        if: forgejo.ref == 'refs/heads/main' && forgejo.event_name != 'pull_request'
        shell: bash
        env:
          CACHE_TOKEN: ${{ secrets.NIX_CACHE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.config/attic"
          printf 'default-server = "homelab"\n[servers.homelab]\nendpoint = "https://nix-cache.jetersen.dev/"\ntoken = "%s"\n' "$CACHE_TOKEN" > "$HOME/.config/attic/config.toml"
          mapfile -t project_shells < "$RUNNER_TEMP/project-shells"
          mapfile -t check_outputs < "$RUNNER_TEMP/check-outputs"
          pc2mqtt_deps=$(cat "$RUNNER_TEMP/pc2mqtt-deps")
          # Locally generated paths may also exist upstream without having its
          # signature locally. Import it so Attic's upstream filter recognizes them.
          # Cache public misses for a day; private-cache lookups remain immediate.
          time nix store copy-sigs --substituter https://cache.nixos.org \
            --option narinfo-cache-negative-ttl 86400 --recursive \
            "$(cat "$RUNNER_TEMP/framework-system")" "$(cat "$RUNNER_TEMP/rocket-system")" "$pc2mqtt_deps" "${project_shells[@]}" "${check_outputs[@]}"
          # Keep large outputs local to CI and let hosts build them as needed.
          time nix path-info --recursive --json \
            "$(cat "$RUNNER_TEMP/framework-system")" "$(cat "$RUNNER_TEMP/rocket-system")" "$pc2mqtt_deps" "${project_shells[@]}" "${check_outputs[@]}" > "$RUNNER_TEMP/system-paths.json"
          time jq -r --argjson maxMiB "$ATTIC_MAX_NAR_MIB" '
            to_entries[] | select(.value.narSize < ($maxMiB * 1024 * 1024)) | .key
          ' "$RUNNER_TEMP/system-paths.json" \
            | attic push --no-closure --stdin homelab:workstations
      - name: Check whether main still selects this revision
        id: current
        if: forgejo.ref == 'refs/heads/main' && forgejo.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo 'notify=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main revision exists; its build will send the notification.'
          fi
      - name: Notify Framework and Rocket to pull the published deployment
        if: steps.current.outputs.notify == 'true'
        shell: bash
        env:
          MQTT_NOTIFY_PASSWORD: ${{ secrets.NIXOS_DEPLOY_MQTT_PASSWORD }}
        run: python3 nixos/ci/notify-hosts.py
      - name: Report job resource use
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for metric in cpu.stat memory.events; do
            if [[ -r "$RUNNER_TEMP/ci-start-$metric" && -r "/sys/fs/cgroup/$metric" ]]; then
              echo "Job cgroup $metric deltas:"
              awk 'NR == FNR { start[$1] = $2; next } { print $1, $2 - start[$1] }' \
                "$RUNNER_TEMP/ci-start-$metric" "/sys/fs/cgroup/$metric"
            fi
          done
          if [[ -r /sys/fs/cgroup/memory.peak ]]; then
            printf 'Job cgroup peak memory bytes: '
            cat /sys/fs/cgroup/memory.peak
          fi
