monitor.alsa.rules = [
  { 
    matches = [
      { device.name = "alsa_card.pci-0000_01_00.1" }
      { device.name = "alsa_card.pci-0000_0f_00.1" }
      { device.name = "alsa_card.usb-046d_Logitech_BRIO_427C10E8-03" }
      { device.name = "alsa_card.pci-0000_0f_00.6" }
      { device.name = "alsa_card.pci-0000_03_00.1" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
  {
    matches = [
      { node.description = "Shure MV7+ Analog Stereo" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
