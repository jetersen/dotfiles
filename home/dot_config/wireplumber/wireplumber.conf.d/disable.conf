monitor.alsa.rules = [
  {
    matches = [
      # Disable GPU audio by hardware ID, independent of PCI slot numbering.
      { device.vendor.id = "0x1002" device.product.id = "0xab40" }
      { device.vendor.id = "0x1002" device.product.id = "0x1640" }
      # Disable both input and output on the Ryzen HD Audio Controller.
      { device.vendor.id = "0x1022" device.product.id = "0x15e3" }
      # Keep the webcam microphone disabled.
      { device.name = "alsa_card.usb-046d_Logitech_BRIO_427C10E8-03" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
  {
    matches = [
      # Match every playback profile while keeping the Shure microphone.
      {
        alsa.card_name = "Shure MV7+"
        media.class = "Audio/Sink"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  # Limit advertised profiles as well as nodes, so device pickers do not
  # offer inactive playback ports that node.disabled alone leaves visible.
  {
    matches = [ { device.vendor.id = "0x14ed" device.product.id = "0x1019" } ]
    actions = {
      update-props = {
        api.alsa.use-ucm = false
        device.profile-set = "shure-mv7-input-only.conf"
      }
    }
  }
  {
    matches = [ { device.vendor.id = "0x152a" device.product.id = "0x88fa" } ]
    actions = {
      update-props = {
        api.alsa.use-ucm = false
        device.profile-set = "jds-element-iv-digital-only.conf"
      }
    }
  }
]
