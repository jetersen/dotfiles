-- Only local clients may use this resolver.
setLocal("127.0.0.2:53")
setACL({"127.0.0.0/8"})
setServFailWhenNoServer(true)

-- Route only this tailnet's names to MagicDNS; public ts.net stays with home DNS.
-- Any reply, including SERVFAIL, shows tailscaled is reachable. Backend sockets are
-- connected once and keep the source address chosen at that time, so they must be
-- reopened when the tailnet route appears after dnsdist starts (reconnectOnUp).
newServer({address="100.100.100.100:53", pool="magic",
  checkName="rockhopper-bleak.ts.net.", checkType="A",
  checkInterval=5, checkTimeout=1500, maxCheckFailures=2, rise=1, reconnectOnUp=true})
addAction("rockhopper-bleak.ts.net.", PoolAction("magic"))

local vpnRoutes, vpnServers, lastVpnConfig = {}, {}, nil
local function loadVpnRoutes()
  local file = io.open("/var/lib/homelab-dns/vpn-routes.lua", "r")
  local content = file and file:read("*a") or "return {}"
  if file then file:close() end
  if content == lastVpnConfig then return end
  -- Only the root bridge writes this file, after validating the plugin's JSON.
  local loader = assert(loadstring(content))
  local entries = loader()
  for _, server in ipairs(vpnServers) do rmServer(server) end
  vpnServers, vpnRoutes = {}, {}
  for _, entry in ipairs(entries) do
    for _, address in ipairs(entry.servers) do
      table.insert(vpnServers, newServer({address=address, source=entry.device,
        pool=entry.pool, healthCheckMode="up"}))
    end
    for _, domain in ipairs(entry.domains) do
      table.insert(vpnRoutes, {domain=newDNSName(domain), length=#domain, pool=entry.pool})
    end
  end
  table.sort(vpnRoutes, function(a,b) return a.length > b.length end)
  lastVpnConfig = content
end
loadVpnRoutes()
addMaintenanceCallback(loadVpnRoutes)
addAction(AllRule(), LuaAction(function(dq)
  for _, route in ipairs(vpnRoutes) do
    if dq.qname:isPartOf(route.domain) then return DNSAction.Pool, route.pool end
  end
  return DNSAction.None
end))

-- Probe a local authoritative record, not a website subject to blocking or
-- upstream availability. Individual NXDOMAIN/REFUSED/SERVFAIL answers never
-- cause a retry against public DNS.
--
-- reconnectOnUp reopens the backend sockets after an outage. Health checks use
-- fresh sockets, but query sockets keep the source address picked at startup.
-- Both resolvers are reached through tailscale0, which can appear after dnsdist
-- starts; without a reconnect the checks pass while every query times out.
--
-- Health checks cannot see a backend whose query sockets are stale, so a watcher
-- also reads the query counters. When nearly every recent query timed out, it
-- recreates the server to get fresh sockets. A new server starts unavailable and
-- rejoins the pool when its first health check passes. Forcing the old server
-- down is pointless because recreating it discards that state, and lazy health
-- checks do not help because their confirming check also uses a fresh socket.
-- BEGIN home-servers
local homeEntries = {}
for _, spec in ipairs({
  {address="192.168.1.21:53", name="cluster"},
  {address="100.99.103.178:53", name="nas"},
}) do
  local options = {address=spec.address, name=spec.name, pool="home",
    checkName="dns.technitium.lan.jetersen.dev.", checkType="A",
    checkInterval=2, checkTimeout=1500, maxCheckFailures=3, rise=2, reconnectOnUp=true}
  table.insert(homeEntries, {options=options, server=newServer(options), samples={}, lastAction=0})
end

local WATCH_SAMPLES, WATCH_MIN_QUERIES, WATCH_FAILED_RATIO, WATCH_COOLDOWN = 10, 3, 0.8, 30
local function watchHomeServers()
  local now = os.time()
  for _, entry in ipairs(homeEntries) do
    local server = entry.server
    table.insert(entry.samples, {queries=server:getQueries(), drops=server:getDrops()})
    if #entry.samples > WATCH_SAMPLES then table.remove(entry.samples, 1) end
    local first, last = entry.samples[1], entry.samples[#entry.samples]
    local queries, drops = last.queries - first.queries, last.drops - first.drops
    if queries >= WATCH_MIN_QUERIES and drops >= queries * WATCH_FAILED_RATIO
        and now - entry.lastAction >= WATCH_COOLDOWN then
      entry.lastAction, entry.samples = now, {}
      warnlog(string.format("home resolver %s dropped %d of %d recent queries; resetting it",
        entry.options.name, drops, queries))
      rmServer(server)
      entry.server = newServer(entry.options)
    end
  end
end
addMaintenanceCallback(watchHomeServers)
-- END home-servers

-- Literal endpoints avoid a DNS bootstrap dependency. TLS verifies the name.
for _, address in ipairs({"1.1.1.2:443", "1.0.0.2:443"}) do
  newServer({address=address, pool="fallback", tls="openssl",
    subjectName="security.cloudflare-dns.com", validateCertificates=true,
    dohPath="/dns-query", checkInterval=10, maxCheckFailures=2, rise=2})
end

-- Work domains are learned from the VPN plugin's routing intent and retained
-- across disconnects. Without an active VPN route, fail closed instead of
-- disclosing them to a public resolver.
local workDomains = newSuffixMatchNode()
local function loadWorkDomains()
  local file = io.open("/var/lib/homelab-dns/work-domains", "r")
  if not file then return end
  local replacement = newSuffixMatchNode()
  for domain in file:lines() do replacement:add(newDNSName(domain)) end
  file:close()
  workDomains = replacement
end
loadWorkDomains()
addMaintenanceCallback(loadWorkDomains)
addAction(LuaRule(function(dq) return workDomains:check(dq.qname) end), RCodeAction(DNSRCode.REFUSED))

-- Private/reverse names always stay at home, including during an outage.
local privateDomains = newSuffixMatchNode()
for _, domain in ipairs({"jetersen.dev.", "ts.net.", "in-addr.arpa.", "ip6.arpa."}) do
  privateDomains:add(newDNSName(domain))
end
addAction(SuffixMatchNodeRule(privateDomains), PoolAction("home"))
addAction(PoolAvailableRule("home"), PoolAction("home"))

-- No packet cache is enabled. Fallback answers have a one-second TTL to limit
-- reuse of public answers after home DNS recovers.
addAction(AllRule(), SetTagAction("homelab-fallback", "yes"))
addAction(AllRule(), PoolAction("fallback"))
addResponseAction(TagRule("homelab-fallback", "yes"), SetMaxTTLResponseAction(1))
